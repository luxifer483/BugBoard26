spring:
  application:
    name: bugboard26
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bugboard26}
    username: ${DB_USERNAME:bugboard_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: bugboard26
    audience: bugboard26-frontend
    ttl-seconds: 3600
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
